name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Compute version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath \
                -ldflags "-s -w \
                  -X github.com/Hostzero-GmbH/proxmox-eventbus/internal/version.Version=$VERSION \
                  -X github.com/Hostzero-GmbH/proxmox-eventbus/internal/version.Commit=$COMMIT \
                  -X github.com/Hostzero-GmbH/proxmox-eventbus/internal/version.Date=$DATE" \
                -o dist/proxmox-eventbus_$arch ./cmd/proxmox-eventbus
          done

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.39.0/nfpm_2.39.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build .deb packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p packages
          for arch in amd64 arm64; do
            ARCH=$arch VERSION=$VERSION nfpm package \
              --config packaging/nfpm.yaml \
              --packager deb \
              --target packages/
          done
          ls -la packages/

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: packages/proxmox-eventbus.cdx.json

      - name: Generate checksums
        run: |
          cd packages
          sha256sum *.deb *.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        run: |
          for f in packages/*.deb packages/SHA256SUMS; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/*.deb
            packages/SHA256SUMS
            packages/*.sig
            packages/*.pem
            packages/proxmox-eventbus.cdx.json
          generate_release_notes: true
